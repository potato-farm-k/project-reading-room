<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="프로젝트 문서와 학습 자료를 탐색하고 읽는 Project Reading Room UI v2"
    />
    <title>Project Reading Room — UI v2</title>
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#reader">본문으로 건너뛰기</a>

    <header class="site-header">
      <button class="brand-button" id="home-button" type="button" aria-label="Root Index 열기">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="brand-copy">
          <strong>Project Reading Room</strong>
          <small>Personal knowledge archive</small>
        </span>
      </button>

      <div class="header-actions">
        <span class="version-badge">UI v2</span>
        <a class="classic-link" href="../index.html">
          기존 UI로 돌아가기 <span aria-hidden="true">↗</span>
        </a>
      </div>
    </header>

    <div class="app-layout">
      <aside class="sidebar" aria-label="문서 탐색">
        <div class="sidebar-intro">
          <p class="section-kicker">Library</p>
          <p>프로젝트의 기준과 배운 것을 차분히 다시 읽는 공간입니다.</p>
        </div>

        <div class="search-field">
          <label for="search-input">문서 검색</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input
            id="search-input"
            type="search"
            placeholder="제목, 설명, 카테고리"
            autocomplete="off"
          />
        </div>

        <div class="filter-block">
          <div class="filter-heading">
            <span>Category</span>
            <span id="document-count" aria-live="polite">0개 문서</span>
          </div>
          <div id="category-filters" class="category-filters" role="group" aria-label="카테고리 필터">
            <button class="filter-chip is-active" type="button" data-category="all" aria-pressed="true">
              전체
            </button>
          </div>
        </div>

        <div class="document-heading">
          <span>Documents</span>
          <span class="list-hint">목록 순서 유지</span>
        </div>
        <nav aria-label="문서 목록">
          <ul id="document-list" class="document-list">
            <li class="list-message">라이브러리를 불러오는 중입니다…</li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <div class="reading-toolbar">
          <div class="breadcrumbs" aria-label="현재 위치">
            <button id="breadcrumb-home" type="button">Library</button>
            <span aria-hidden="true">/</span>
            <span id="breadcrumb-current">Root Index</span>
          </div>
          <button id="print-button" class="print-button" type="button">
            <span class="print-icon" aria-hidden="true"></span>
            인쇄 / PDF
          </button>
        </div>

        <article id="reader" class="reader" aria-live="polite" aria-busy="true">
          <div class="reader-state">
            <span class="state-dot" aria-hidden="true"></span>
            <p class="eyebrow">Reading room</p>
            <h1>라이브러리를 준비하고 있습니다.</h1>
          </div>
        </article>
      </main>
    </div>

    <noscript>
      <p class="noscript-message">문서 목록과 본문을 보려면 JavaScript를 활성화해 주세요.</p>
    </noscript>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
